<!doctype html>
<html lang="{{meta.lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{meta.title}}</title>
<meta name="description" content="{{meta.description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{meta.title}}">
<meta property="og:description" content="{{meta.description}}">
<meta property="og:locale" content="{{meta.ogLocale}}">
<meta name="color-scheme" content="dark light">
{{alternates}}
<script>try { var t = localStorage.getItem('agent-security-guide:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
{{styles}}
</style>
</head>
<body>
<!-- The agents' logos, used by the selector, the home page and the drawing -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="codex-g" gradientUnits="userSpaceOnUse" x1="12" x2="12" y1="0" y2="24"><stop offset="0" stop-color="#B1A7FF"/><stop offset=".5" stop-color="#7A9DFF"/><stop offset="1" stop-color="#3941FF"/></linearGradient>
    <symbol id="logo-claude" viewBox="0 0 24 24"><path fill="#D97757" fill-rule="evenodd" clip-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z"/></symbol>
    <symbol id="logo-codex" viewBox="0 0 24 24"><path fill="url(#codex-g)" fill-rule="evenodd" clip-rule="evenodd" d="M8.086.457a6.105 6.105 0 013.046-.415c1.333.153 2.521.72 3.564 1.7a.117.117 0 00.107.029c1.408-.346 2.762-.224 4.061.366l.063.03.154.076c1.357.703 2.33 1.77 2.918 3.198.278.679.418 1.388.421 2.126a5.655 5.655 0 01-.18 1.631.167.167 0 00.04.155 5.982 5.982 0 011.578 2.891c.385 1.901-.01 3.615-1.183 5.14l-.182.22a6.063 6.063 0 01-2.934 1.851.162.162 0 00-.108.102c-.255.736-.511 1.364-.987 1.992-1.199 1.582-2.962 2.462-4.948 2.451-1.583-.008-2.986-.587-4.21-1.736a.145.145 0 00-.14-.032c-.518.167-1.04.191-1.604.185a5.924 5.924 0 01-2.595-.622 6.058 6.058 0 01-2.146-1.781c-.203-.269-.404-.522-.551-.821a7.74 7.74 0 01-.495-1.283 6.11 6.11 0 01-.017-3.064.166.166 0 00.008-.074.115.115 0 00-.037-.064 5.958 5.958 0 01-1.38-2.202 5.196 5.196 0 01-.333-1.589 6.915 6.915 0 01.188-2.132c.45-1.484 1.309-2.648 2.577-3.493.282-.188.55-.334.802-.438.286-.12.573-.22.861-.304a.129.129 0 00.087-.087A6.016 6.016 0 015.635 2.31C6.315 1.464 7.132.846 8.086.457zm-.804 7.85a.848.848 0 00-1.473.842l1.694 2.965-1.688 2.848a.849.849 0 001.46.864l1.94-3.272a.849.849 0 00.007-.854l-1.94-3.393zm5.446 6.24a.849.849 0 000 1.695h4.848a.849.849 0 000-1.696h-4.848z"/></symbol>
  </defs>
</svg>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#" id="brand">Agent <span>Security</span></a>
    <div class="crumb" id="crumb"></div>
    <div class="spacer"></div>
    <a class="ghost" href="#" id="back" hidden><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span class="back-t">{{ui.contents}}</span></a>
    <div class="seg agents" role="group" aria-label="{{ui.agent}}"><button type="button" data-agent="claude" title="Claude Code" aria-label="Claude Code"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#logo-claude"/></svg></button><button type="button" data-agent="codex" title="Codex" aria-label="Codex"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#logo-codex"/></svg></button></div>
    <nav class="seg langs" aria-label="{{ui.language}}">{{languages}}</nav>
    <button type="button" class="ghost icon" id="theme"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle class="sun" cx="8" cy="8" r="3"/><path class="sun" d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/><path class="moon" d="M13 9.6A5.5 5.5 0 0 1 6.4 3a5.5 5.5 0 1 0 6.6 6.6z"/></svg></button>
  </div>
</header>

<div class="layout">
  <div class="stage" id="stage">
    <svg id="scene" viewBox="0 0 1232 1620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="{{meta.diagramLabel}}">
      <defs>
        <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.1" class="dotc"/></pattern>
        <clipPath id="clip-ups"><rect x="60" y="826" width="340" height="202" rx="10"/></clipPath>
        <clipPath id="clip-post"><rect x="450" y="826" width="340" height="202" rx="10"/></clipPath>
        <clipPath id="clip-pre"><rect x="840" y="826" width="330" height="202" rx="10"/></clipPath>
        <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="bm-0"/><stop offset=".8" class="bm-1"/><stop offset="1" class="bm-2"/></linearGradient>
        <linearGradient id="beam-no" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="bn-0"/><stop offset=".8" class="bn-1"/><stop offset="1" class="bn-2"/></linearGradient>
        <marker id="mk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
      </defs>
      <rect class="floor" x="-3000" y="-3000" width="8000" height="8000"/>

      <!-- the managed policy, around the harness -->
      <rect class="policy" data-c="policy" data-k="policy" x="16" y="344" width="1198" height="1008" rx="32"/>

      <!-- the harness: the model's side above the hook, the machine's side below it -->
      <rect class="panel-h" x="32" y="360" width="1166" height="976" rx="24"/>
      <use class="h-logo" href="#logo-claude" x="56" y="377" width="22" height="22"/>
      <text class="h-title" x="88" y="394">{{diagram.harness}}</text>
      <text class="h-sub" id="h-sub" x="88" y="394">{{diagram.runsOn}}</text>

      <!-- arrows: each one is also the path a packet takes; "from>to" names the two ends -->
      <g id="edges">
        <path class="flow" data-edge="session>prompt" d="M230 300 V530"/>
        <path class="flow" data-edge="prompt>hook.ups" d="M230 740 V826"/>
        <path class="flow" data-edge="hook.ups>context" d="M400 930 H425 V635 H450"/>
        <path class="flow" data-edge="memory>context" d="M620 506 V530"/>
        <path class="flow" data-edge="context>model" d="M790 635 H840"/>
        <path class="flow" data-edge="model>session" d="M1005 530 V330 H600 V300"/>
        <path class="flow" data-edge="model>hook.pre" d="M1005 740 V826"/>
        <path class="flow" data-edge="hook.pre>perm" d="M1005 1028 V1090"/>
        <path class="flow" data-edge="perm>tools" d="M840 1180 H790"/>
        <path class="flow" data-edge="tools>terminal" d="M450 1170 H400"/>
        <path class="flow" data-edge="terminal>tools" d="M400 1220 H450"/>
        <path class="flow" data-edge="tools>hook.post" d="M620 1090 V1028"/>
        <path class="flow" data-edge="hook.post>context" d="M620 826 V740"/>
        <path class="flow net" data-edge="terminal>proxy" d="M230 1300 V1416"/>
        <path class="flow net" data-edge="proxy>net" d="M230 1416 V1490 H560"/>
        <path class="flow net" data-edge="terminal>net" d="M230 1300 V1490 H560"/>
      </g>
      <text class="edge-t" data-k="model>session" x="800" y="322" text-anchor="middle" data-fit="200">{{diagram.reply}}</text>
      <text class="edge-t" data-k="model>hook.pre" x="1018" y="772" data-fit="150">{{diagram.toolRequest}}</text>
      <text class="edge-t" data-k="tools>hook.post" x="632" y="1066" data-fit="150">{{diagram.result}}</text>
      <g id="trails"></g>

      <!-- the proxy, on the way out of the sandbox -->
      <g class="proxy" data-c="proxy" data-k="proxy" id="c-proxy">
        <path class="rail2" d="M223 1370 V1470 M237 1370 V1470"/>
        <text class="proxy-t" x="210" y="1421" text-anchor="middle" transform="rotate(-90 210 1421)">{{diagram.proxy}}</text>
        <g class="callout" id="proxy-note">
          <rect class="panel box" x="256" y="1374" width="284" height="92" rx="12"/>
          <text class="meta" data-fm="proxy" x="272" y="1396" data-max="252"></text>
          <g data-code="proxy" data-x="272" data-y="1418" data-n="3" data-max="252"></g>
        </g>
      </g>

      <!-- the session: the agent's chat, with the conversation title, the messages and the input box -->
      <g class="node" data-k="session" id="c-session">
        <rect class="panel box sess" x="60" y="40" width="580" height="260" rx="16"/>
        <g class="nb">
          <text class="sess-t" id="sess-t" x="80" y="68">{{diagram.session}}</text>
          <path class="sess-chev" id="sess-chev" d="M0 0 L3.5 3.5 L7 0"/>
          <g id="chat-msgs"></g>
          <rect class="field" x="76" y="204" width="548" height="84" rx="18"/>
          <text class="chat-ph" id="chat-ph" x="94" y="232">{{diagram.sessionPlaceholder}}</text>
          <text class="chat-t" id="chat-in0" x="94" y="232"></text>
          <text class="chat-t" id="chat-in1" x="94" y="250"></text>
          <rect class="add-b" x="88" y="254" width="26" height="26" rx="8"/>
          <path class="add-i" d="M101 261.5 V272.5 M95.5 267 H106.5"/>
          <g class="send" id="send"><rect class="send-b" x="586" y="254" width="26" height="26" rx="8"/><path class="send-a" d="M599 273 V261.5 M594 266.5 L599 261.5 L604 266.5"/></g>
        </g>
      </g>

      <!-- memory: files outside the model, loaded into the context when a session starts -->
      <g class="node" data-k="memory" id="c-memory">
        <rect class="panel box" x="450" y="392" width="340" height="114" rx="14"/>
        <g class="nb">
          <path class="ico o-mem" transform="translate(465 404)" d="M4 2.5 H10 L12.5 5 V13.5 H4 Z M10 2.5 V5 H12.5 M6.2 8 H10.3 M6.2 10.6 H10.3"/>
          <text class="title" x="489" y="418">{{diagram.memory}}</text>
          <text class="desc" x="772" y="418" text-anchor="end" data-fit="170">{{diagram.memorySub}}</text>
          <g id="mem-rows"></g>
        </g>
      </g>

      <!-- the prompt: one message, as it is sent to the API, in an editor -->
      <g class="node" data-k="prompt" id="c-prompt">
        <rect class="panel box ed" x="60" y="530" width="340" height="210" rx="14"/>
        <g class="nb">
          <path class="ed-bar" d="M74 530 H386 A14 14 0 0 1 400 544 V566 H60 V544 A14 14 0 0 1 74 530 Z"/>
          <path class="ed-tab" d="M70 566 V544 A6 6 0 0 1 76 538 H186 A6 6 0 0 1 192 544 V566 Z"/>
          <text class="ed-ic" x="80" y="557">{ }</text>
          <text class="title t-tab" x="110" y="557">{{diagram.prompt}}</text>
          <text class="meta" data-fm="prompt" x="386" y="556" text-anchor="end" data-max="180"></text>
          <path class="ed-gut" d="M96 566 V740"/>
          <g id="ln-prompt"></g>
          <text class="desc" data-fsub="prompt" x="106" y="592">{{diagram.promptSub}}</text>
          <g data-code="prompt" data-x="106" data-y="592" data-n="9" data-max="282"></g>
        </g>
      </g>

      <!-- the context: the stack of messages sent to the model, each marked by where it came from -->
      <g class="node" data-k="context" id="c-context">
        <rect class="panel box" x="450" y="530" width="340" height="210" rx="16"/>
        <g class="nb">
          <path class="ico" transform="translate(466 545)" d="M8 2 L14 5 L8 8 L2 5 Z M2 8 L8 11 L14 8 M2 11 L8 14 L14 11"/>
          <text class="title" x="490" y="558">{{diagram.context}}</text>
          <text class="meta" data-fm="context" x="770" y="558" text-anchor="end" data-max="150"></text>
          <text class="desc" data-fsub="context" x="470" y="584">{{diagram.contextSub}}</text>
          <g id="ctx-cards"></g>
          <g data-code="context" data-x="472" data-y="584" data-n="10" data-max="300"></g>
        </g>
      </g>

      <!-- the model: its response to the context -->
      <g class="node" data-k="model" id="c-model">
        <rect class="panel box" x="840" y="530" width="330" height="210" rx="16"/>
        <g class="nb">
          <path class="ico o-model" transform="translate(856 545)" d="M8 1.8 C8.5 5.4 10.6 7.5 14.2 8 C10.6 8.5 8.5 10.6 8 14.2 C7.5 10.6 5.4 8.5 1.8 8 C5.4 7.5 7.5 5.4 8 1.8 Z"/>
          <text class="title" x="880" y="558">{{diagram.model}}</text>
          <text class="meta" data-fm="model" x="1150" y="558" text-anchor="end" data-max="150"></text>
          <text class="desc" data-fsub="model" x="860" y="588">{{diagram.modelSub}}</text>
          <g data-code="model" data-x="860" data-y="588" data-n="10" data-max="294"></g>
        </g>
      </g>

      <!-- the hook: one program, called at three events, between the model's side and the machine's -->
      <g class="node" data-k="hook" id="c-hook">
        <rect class="panel box" x="44" y="790" width="1142" height="250" rx="18"/>
        <g class="nb">
          <path class="ico" transform="translate(60 800)" d="M8 1.5 L13.5 3.5 V7.5 C13.5 11 11 13.5 8 14.5 C5 13.5 2.5 11 2.5 7.5 V3.5 Z M5.6 8 L7.4 9.8 L10.6 6.4"/>
          <text class="title" x="84" y="814">{{diagram.hook}}</text>
          <text class="meta hook-cmd" data-c="scan" x="1170" y="814" text-anchor="end">agent-secret-scan</text>
          <g class="lane" data-lane="ups" id="lane-ups">
            <rect class="lane-b box" x="60" y="826" width="340" height="202" rx="10"/>
            <g clip-path="url(#clip-ups)"><rect class="beam" data-c="scan" x="60" y="798" width="340" height="28" style="--h: 230px"/><rect class="lane-bar" x="60" y="826" width="3" height="202"/></g>
            <text class="lane-t" x="76" y="848">UserPromptSubmit</text>
            <g data-code="hook.ups" data-x="76" data-y="870" data-n="10" data-max="310"></g>
          </g>
          <g class="lane" data-lane="post" id="lane-post">
            <rect class="lane-b box" x="450" y="826" width="340" height="202" rx="10"/>
            <g clip-path="url(#clip-post)"><rect class="beam" data-c="scan" x="450" y="798" width="340" height="28" style="--h: 230px"/><rect class="lane-bar" x="450" y="826" width="3" height="202"/></g>
            <text class="lane-t" x="466" y="848">PostToolUse</text>
            <g data-code="hook.post" data-x="466" data-y="870" data-n="10" data-max="310"></g>
          </g>
          <g class="lane" data-lane="pre" id="lane-pre">
            <rect class="lane-b box" x="840" y="826" width="330" height="202" rx="10"/>
            <g clip-path="url(#clip-pre)"><rect class="beam" data-c="scan" x="840" y="798" width="330" height="28" style="--h: 230px"/><rect class="lane-bar" x="840" y="826" width="3" height="202"/></g>
            <text class="lane-t" x="856" y="848">PreToolUse</text>
            <g data-code="hook.pre" data-x="856" data-y="870" data-n="10" data-max="300"></g>
          </g>
        </g>
      </g>

      <!-- the tools: the agent's tools; the one in use is marked -->
      <g class="node" data-k="tools" id="c-tools">
        <rect class="panel box" x="450" y="1090" width="340" height="210" rx="16"/>
        <g class="nb">
          <path class="ico o-tool" transform="translate(466 1105)" d="M10.6 2.1 A3.6 3.6 0 0 0 6.6 6.8 L2.3 11.1 A1.5 1.5 0 0 0 4.4 13.2 L8.7 8.9 A3.6 3.6 0 0 0 13.4 4.9 L11.3 7 L9.3 6.7 L9 4.7 Z"/>
          <text class="title" x="490" y="1118">{{diagram.tools}}</text>
          <g id="tool-list"></g>
        </g>
      </g>

      <!-- the permissions: the file or profile that decided, and its verdict -->
      <g class="node" data-k="perm" id="c-perm">
        <rect class="panel box" x="840" y="1090" width="330" height="210" rx="16"/>
        <g class="nb">
          <path class="ico" transform="translate(856 1105)" d="M3.5 7.5 H12.5 V14 H3.5 Z M5.5 7.5 V5 A2.5 2.5 0 0 1 10.5 5 V7.5"/>
          <text class="title" x="880" y="1118">{{diagram.perm}}</text>
          <text class="meta" data-fm="perm" x="1150" y="1118" text-anchor="end" data-max="160"></text>
          <text class="desc" data-fsub="perm" x="860" y="1146">{{diagram.permSub}}</text>
          <g data-code="perm" data-x="860" data-y="1146" data-n="7" data-max="294"></g>
          <g class="verdict" id="perm-verdict">
            <rect class="card" x="852" y="1260" width="306" height="28" rx="6"/>
            <rect class="v-bar" x="852" y="1260" width="3" height="28" rx="1.5"/>
            <path class="v-i" d=""/>
            <text class="v-t" x="886" y="1278.5"></text>
          </g>
        </g>
      </g>

      <!-- the terminal, inside the sandbox -->
      <g data-k="sandbox" id="c-sandbox">
        <rect class="membrane" data-c="sandbox" x="46" y="1074" width="368" height="242" rx="24"/>
      </g>
      <g class="node" data-k="terminal" id="c-terminal">
        <rect class="panel term-bg box" x="60" y="1090" width="340" height="210" rx="12"/>
        <g class="nb">
          <path class="term-bar" d="M72 1090 H388 A12 12 0 0 1 400 1102 V1116 H60 V1102 A12 12 0 0 1 72 1090 Z"/>
          <circle class="tdot" cx="78" cy="1103" r="4"/><circle class="tdot" cx="92" cy="1103" r="4"/><circle class="tdot" cx="106" cy="1103" r="4"/>
          <text class="term-title" x="230" y="1107" text-anchor="middle">bash — ~/project</text>
          <g id="term-lines"></g>
        </g>
      </g>
      <g data-c="sandbox" data-k="sandbox" data-pill="14" data-anchor="end">
        <rect class="tag" x="318" y="1063" width="92" height="22" rx="11"/>
        <text class="tag-t" x="364" y="1078" text-anchor="middle">{{diagram.sandboxTag}}</text>
      </g>
      <g data-c="policy" data-k="policy" data-pill="16" data-anchor="end">
        <rect class="tag" x="994" y="1340" width="200" height="24" rx="12"/>
        <text class="tag-t" x="1094" y="1356" text-anchor="middle">{{diagram.policyTag}}</text>
      </g>

      <!-- the internet, seen as a browser -->
      <g class="node" data-k="net" id="c-net">
        <rect class="panel box page" x="560" y="1380" width="500" height="220" rx="16"/>
        <g class="nb">
          <path class="winbar" d="M576 1380 H1044 A16 16 0 0 1 1060 1396 V1412 H560 V1396 A16 16 0 0 1 576 1380 Z"/>
          <circle class="wdot" cx="580" cy="1396" r="4"/><circle class="wdot" cx="594" cy="1396" r="4"/><circle class="wdot" cx="608" cy="1396" r="4"/>
          <path class="tab" d="M626 1412 V1394 A7 7 0 0 1 633 1387 H813 A7 7 0 0 1 820 1394 V1412 Z"/>
          <path class="fav" d="M646 1400 m-6 0 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0 M640 1400 H652 M646 1394 C643 1397.5 643 1402.5 646 1406 C649 1402.5 649 1397.5 646 1394"/>
          <text class="tab-t" id="net-tab" x="658" y="1405" data-max="152"></text>
          <rect class="addr" x="576" y="1422" width="468" height="30" rx="15"/>
          <path class="lock-i" d="M591 1435 h10 v8 h-10 z M593 1435 v-3 a3 3 0 0 1 6 0 v3"/>
          <text class="addr-t" id="net-url" x="610" y="1442" data-max="420"></text>
          <text class="page-t" data-nl="0" x="584" y="1488"></text>
          <text class="page-t" data-nl="1" x="584" y="1518"></text>
          <text class="page-t" data-nl="2" x="584" y="1542"></text>
          <text class="page-t" data-nl="3" x="584" y="1566"></text>
        </g>
      </g>

      <g id="fx"></g>
    </svg>
    <div class="scrim" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="player seg" id="player" role="group" aria-label="{{ui.player}}">
      <button type="button" id="p-prev" aria-label="{{ui.prev}}" title="{{ui.prev}}"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
      <button type="button" id="p-play"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path class="i-play" d="M5 3.2v9.6L12.6 8z"/><path class="i-pause" d="M5.5 3.5v9M10.5 3.5v9"/><path class="i-replay" d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v3h3"/></svg></button>
      <button type="button" id="p-next" aria-label="{{ui.next}}" title="{{ui.next}}"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
      <span class="p-at"><b id="p-n"></b> / <span id="p-of"></span></span>
    </div>
  </div>
  <main class="doc" id="doc" aria-live="polite"></main>
</div>
